  <line x1="34" y1="101" x2="866" y2="101" stroke="var(--color-rule)" stroke-width="2"/>
  <g transform="translate(0 122)">
      <rect x="30" y="0" width="840" height="66" rx="12" fill="var(--color-band)"/>
      <text class="number" x="53" y="42">01</text>
      <text class="category" x="118" y="40">AI 서비스</text>
      <text class="project" x="300" y="32">FOWOCO</text>
      <text class="description" x="300" y="52">검색과 AI 작업 흐름</text>
      <rect x="808" y="19" width="42" height="28" rx="14" fill="var(--color-accent-soft)"/>
      <text class="role" x="829" y="38">팀</text>
    </g>
<g transform="translate(0 200)">
      <rect x="30" y="0" width="840" height="66" rx="12" fill="var(--color-band-2)"/>
      <text class="number" x="53" y="42">02</text>
      <text class="category" x="118" y="40">AI 서비스</text>
      <text class="project" x="300" y="32">LLM Gateway</text>
      <text class="description" x="300" y="52">모델 연결과 응답 스트리밍</text>
      <rect x="808" y="19" width="42" height="28" rx="14" fill="var(--color-accent-soft)"/>
      <text class="role" x="829" y="38">팀</text>
    </g>
<g transform="translate(0 278)">
      <rect x="30" y="0" width="840" height="66" rx="12" fill="var(--color-band)"/>
      <text class="number" x="53" y="42">03</text>
      <text class="category" x="118" y="40">에이전트 도구</text>
      <text class="project" x="300" y="32">HWPX Document Plugin</text>
