      <rect x="808" y="19" width="42" height="28" rx="14" fill="var(--color-accent-soft)"/>
      <text class="role" x="829" y="38">팀</text>
    </g>
<g transform="translate(0 356)">
      <rect x="30" y="0" width="840" height="66" rx="12" fill="var(--color-band-2)"/>
      <text class="number" x="53" y="42">04</text>
      <text class="category" x="118" y="40">AI 개발 도구</text>
      <text class="project" x="300" y="32">OwnHands</text>
