<!-- Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 -->
<!-- Hallmark · genre: modern-minimal · macrostructure: Index-First · theme: Cobalt · enrichment: Tier-B SVG · feature: F3 tabular spec sheet -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">박태정의 프로젝트 인덱스</title>
  <desc id="desc">FOWOCO, LLM Gateway, HWPX Document Plugin, OwnHands 네 프로젝트를 같은 크기의 행으로 보여주는 목록</desc>
  <style>
    :root {
      --color-paper: oklch(16% 0.012 260);
      --color-band: oklch(20% 0.016 260);
      --color-band-2: oklch(18% 0.014 260);
      --color-ink: oklch(95% 0.007 260);
      --color-muted: oklch(72% 0.018 260);
      --color-rule: oklch(32% 0.025 260);
      --color-accent: oklch(70% 0.17 255);
      --color-accent-soft: oklch(28% 0.065 255);
      --font-display: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      --font-body: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      --font-mono: "SFMono-Regular", "JetBrains Mono", monospace;
    }
    .title { font-family: var(--font-display); font-size: 32px; font-weight: 800; letter-spacing: -1px; fill: var(--color-ink); }
    .subtitle { font-family: var(--font-body); font-size: 20px; font-weight: 500; fill: var(--color-muted); }
    .number { font-family: var(--font-mono); font-size: 20px; font-weight: 700; fill: var(--color-accent); }
    .category { font-family: var(--font-body); font-size: 19px; font-weight: 700; fill: var(--color-muted); }
    .project { font-family: var(--font-display); font-size: 25px; font-weight: 800; fill: var(--color-ink); }
    .description { font-family: var(--font-body); font-size: 16px; font-weight: 500; fill: var(--color-muted); }
    .role { font-family: var(--font-body); font-size: 15px; font-weight: 800; text-anchor: middle; fill: var(--color-accent); }
  </style>
  <rect width="900" height="460" rx="24" fill="var(--color-paper)"/>
  <text class="title" x="34" y="53">프로젝트 인덱스</text>
